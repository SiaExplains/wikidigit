<!doctype html>
<!--
  WikiDigit cover template (1216x521, 21:9). Copy it, set the palette, then replace the
  #subject group with an illustration of this specific story. Rules:
  - Run `node scripts/cover-style.mjs` first. It lists the palettes and compositions that are
    still allowed (not used by the last few posts) and prints each palette's hex values.
    Paste the chosen palette into the :root variables below. Never hand-pick "navy + blue glow"
    out of habit: that is the "midnight" palette and it is only allowed when the script says so.
  - Build the chosen composition (see scripts/cover-template/styles.json). The example below is
    a "flat-poster" on the "paper" palette; delete it and draw your own.
  - No text, letters, numbers or logos (the card/hero already shows the title).
  - Keep the main subject inside the centre safe zone (x 236-980): cards crop to 16:9.
  - Keep the bottom ~35% calm (few details). The hero overlays the title there with its own dark
    gradient, so light palettes are fine, but busy detail under the title is not.
  - Use the category colour as one accent if it fits (lib/categories.ts).
  - After rendering: node scripts/cover-style.mjs --record <slug> --palette <p> --composition <c> --subject "..."
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* palette: paper (copy the six values of the palette you picked) */
    --bg0: #f6efe3;
    --bg1: #e3d6bf;
    --ink: #1d1a16;
    --accent: #A85527;
    --accent2: #1d5fae;
    --highlight: #ffffff;
  }
  html, body { margin: 0; width: 1216px; height: 521px; overflow: hidden; background: var(--bg1); }
  svg { display: block; }
  .bg0 { stop-color: var(--bg0); } .bg1 { stop-color: var(--bg1); }
  .ink { fill: var(--ink); } .accent { fill: var(--accent); } .accent2 { fill: var(--accent2); } .hi { fill: var(--highlight); }
  .ink-line { stroke: var(--ink); fill: none; }
</style>
</head>
<body>
<svg id="scene" width="1216" height="521" viewBox="0 0 1216 521" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="bg0"/>
      <stop offset="1" class="bg1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
    <!-- subtle paper grain; drop it for glossy compositions -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1216" height="521" fill="url(#bg)"/>

  <!-- example subject (flat-poster): a big sun disc, a rising stack of blocks, one block falling out.
       Replace everything inside #subject with this story's objects. -->
  <g id="subject">
    <circle cx="700" cy="190" r="130" class="accent2" opacity="0.18"/>
    <circle cx="700" cy="190" r="96" class="accent2"/>
    <g filter="url(#shadow)">
      <rect x="470" y="300" width="110" height="60" class="ink"/>
      <rect x="470" y="236" width="110" height="60" class="ink"/>
      <rect x="470" y="172" width="110" height="60" class="ink"/>
      <rect x="600" y="300" width="110" height="60" class="ink"/>
      <rect x="600" y="236" width="110" height="60" class="ink"/>
      <rect x="730" y="300" width="110" height="60" class="ink"/>
      <rect x="770" y="150" width="110" height="60" class="accent" transform="rotate(14 825 180)"/>
    </g>
    <path d="M300 372 H920" class="ink-line" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect width="1216" height="521" filter="url(#grain)" opacity="0.6"/>
</svg>
</body>
</html>
